<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="30%" cy="18%" r="90%">
      <stop offset="0" stop-color="#29384d"/>
      <stop offset="0.48" stop-color="#171d29"/>
      <stop offset="1" stop-color="#0c0f15"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#78efff"/>
      <stop offset="0.43" stop-color="#3e9dff"/>
      <stop offset="1" stop-color="#a98cff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.18  0 1 0 0 0.55  0 0 1 0 1  0 0 0 .42 0"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="blur"/>
      <feOffset dy="12" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope=".42"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect x="42" y="42" width="940" height="940" rx="216" fill="none" stroke="#ffffff" stroke-opacity=".10" stroke-width="3"/>

  <path d="M 250 706 L 250 321 C 250 267 313 237 356 270 L 512 390 L 668 270 C 711 237 774 267 774 321 L 774 706"
        fill="none" stroke="url(#mark)" stroke-width="92" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" opacity=".68"/>
  <path d="M 250 706 L 250 321 C 250 267 313 237 356 270 L 512 390 L 668 270 C 711 237 774 267 774 321 L 774 706"
        fill="none" stroke="url(#mark)" stroke-width="92" stroke-linecap="round" stroke-linejoin="round" filter="url(#softShadow)"/>
  <circle cx="512" cy="390" r="22" fill="#f4fbff"/>
  <circle cx="512" cy="390" r="9" fill="#8edfff"/>
