name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/android/**"
      - "package.json"
      - "package-lock.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "src/**"
      - "tests/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Read release metadata
        id: metadata
        shell: bash
        run: |
          version="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and test bridge
        run: |
          pnpm typecheck
          pnpm test

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('apps/android/pubspec.lock') }}
          cache-path: ${{ runner.tool_cache }}/flutter

      - name: Install Flutter dependencies
        working-directory: apps/android
        run: flutter pub get

      - name: Analyze and test Flutter app
        working-directory: apps/android
        run: |
          flutter analyze
          flutter test

      - name: Install Android CMake
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          for attempt in 1 2 3; do
            rm -rf "${ANDROID_HOME}/cmake/3.22.1" "${ANDROID_HOME}/.temp"
            set +o pipefail
            yes | "${sdkmanager}" --install "cmake;3.22.1"
            status=${PIPESTATUS[1]}
            set -o pipefail
            if [ "${status}" -eq 0 ]; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Build debug APK
        working-directory: apps/android
        run: |
          sed -i 's/-Xmx8G -XX:MaxMetaspaceSize=4G/-Xmx4G -XX:MaxMetaspaceSize=2G/' android/gradle.properties
          flutter build apk --debug --split-per-abi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-codex-debug-apk-x86_64
          path: apps/android/build/app/outputs/flutter-apk/app-x86_64-debug.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: mobile-codex-debug-apk-x86_64
          path: release-assets

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          tag="android-v${VERSION}-${RUN_ID}"
          title="MobileCodex Android ${VERSION} (${RUN_ID})"
          notes="Automated x86_64 debug APK built from ${SHA}."
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${tag}" release-assets/app-x86_64-debug.apk --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${tag}" release-assets/app-x86_64-debug.apk \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${SHA}" \
              --title "${title}" \
              --notes "${notes}"
          fi
