name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "tests/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Typecheck and test bridge
        run: |
          npm run typecheck
          npm test

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('apps/mobile/pubspec.lock') }}
          cache-path: ${{ runner.tool_cache }}/flutter

      - name: Install Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze and test Flutter app
        working-directory: apps/mobile
        run: |
          flutter analyze
          flutter test

      - name: Install Android CMake
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          for attempt in 1 2 3; do
            rm -rf "${ANDROID_HOME}/cmake/3.22.1" "${ANDROID_HOME}/.temp"
            if yes | "${sdkmanager}" --install "cmake;3.22.1"; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Build debug APK
        working-directory: apps/mobile
        run: |
          sed -i 's/-Xmx8G -XX:MaxMetaspaceSize=4G/-Xmx4G -XX:MaxMetaspaceSize=2G/' android/gradle.properties
          flutter build apk --debug --split-per-abi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-codex-debug-apk-x86_64
          path: apps/mobile/build/app/outputs/flutter-apk/app-x86_64-debug.apk
          if-no-files-found: error
          retention-days: 14
