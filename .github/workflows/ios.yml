name: iOS App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/ios/**"
      - "package.json"
      - "package-lock.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "src/**"
      - "tests/**"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and test bridge
        run: |
          pnpm typecheck
          pnpm test

  build:
    needs: test
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build unsigned iOS archive
        working-directory: apps/ios
        run: xcodebuild -project Runner.xcodeproj -scheme Runner -configuration Release -sdk iphoneos -archivePath build/Runner.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned iOS IPA
        working-directory: apps/ios
        shell: bash
        run: |
          set -euo pipefail
          app_path="build/Runner.xcarchive/Products/Applications/Runner.app"
          test -d "$app_path"
          mkdir -p build/ios/ipa/Payload
          ditto "$app_path" build/ios/ipa/Payload/Runner.app
          ditto -c -k --sequesterRsrc --keepParent build/ios/ipa/Payload build/ios/ipa/mobile-codex-ios-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: mobile-codex-ios-unsigned-ipa
          path: apps/ios/build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload Xcode archive
        uses: actions/upload-artifact@v4
        with:
          name: mobile-codex-ios-xcarchive
          path: apps/ios/build/*.xcarchive
          if-no-files-found: error
          retention-days: 14
